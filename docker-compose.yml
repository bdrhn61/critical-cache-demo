services:

  postgres:
    image: postgres:17
    container_name: critical-cache-postgres
    environment:
      POSTGRES_DB: critical_cache
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
      image: redis:7
      container_name: critical-cache-redis
      ports:
        - "6379:6379"

volumes:
  postgres_data: