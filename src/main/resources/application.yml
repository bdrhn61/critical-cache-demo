spring:
  application:
    name: critical-cache-demo

  datasource:
    url: jdbc:postgresql://localhost:5434/critical_cache
    username: postgres
    password: postgres

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true